<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">How a GhostMesh packet moves across a peer-to-peer mesh</title>
  <desc id="desc">An end-to-end encrypted message passes from a sender through multiple relay peers to a receiver. Animated dashes indicate a route; a second dotted path shows an alternate hop.</desc>
  <defs>
    <linearGradient id="activeRoute" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f3ff"/>
      <stop offset="1" stop-color="#2bff88"/>
    </linearGradient>
    <pattern id="meshGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#133044" stroke-opacity=".36" stroke-width=".7"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L8 4L0 8Z" fill="#00f3ff"/>
    </marker>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .tiny { font-size: 9px; letter-spacing: 1.6px; }
      .muted { fill: #7791a8; }
      .route { fill: none; stroke: url(#activeRoute); stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 7 13; animation: travel 2s linear infinite; }
      .alt { fill: none; stroke: #b000ff; stroke-opacity: .56; stroke-width: 1.4; stroke-dasharray: 3 9; animation: travel 3.2s linear infinite reverse; }
      .ring { transform-box: fill-box; transform-origin: center; animation: ping 2s ease-out infinite; }
      .delay { animation-delay: 1s; }
      @keyframes travel { to { stroke-dashoffset: -80; } }
      @keyframes ping { 0% { transform: scale(.7); opacity: .75; } 85%, 100% { transform: scale(2.1); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .route, .alt, .ring { animation: none !important; } }
    </style>
  </defs>

  <rect width="1200" height="390" rx="16" fill="#050a10"/>
  <rect width="1200" height="390" rx="16" fill="url(#meshGrid)"/>
  <path d="M38 95H1162" stroke="#00f3ff" stroke-opacity=".16"/>
  <text x="54" y="43" fill="#00f3ff" class="tiny" font-weight="700">GHOSTMESH // OPPORTUNISTIC ROUTING</text>
  <text x="54" y="76" fill="#e2f5ff" font-size="21" font-weight="700" letter-spacing=".2">Encrypted at the edges. Relay-friendly in between.</text>
  <rect x="936" y="30" width="210" height="35" rx="4" fill="#08131d" stroke="#00f3ff" stroke-opacity=".35"/>
  <circle cx="954" cy="47" r="3.5" fill="#2bff88"/>
  <text x="966" y="51" fill="#a9c0d1" class="tiny">CIPHERTEXT ONLY</text>

  <!-- Quiet alternate path -->
  <path d="M167 218C245 124 310 116 390 152" class="alt"/>
  <path d="M446 155C530 104 610 116 689 181" class="alt"/>
  <path d="M728 195C820 164 891 176 1005 213" class="alt"/>

  <!-- Active multi-hop path -->
  <path d="M167 218C245 300 310 298 390 258" class="route"/>
  <path d="M448 251C535 214 610 214 689 218" class="route"/>
  <path d="M729 218C819 218 907 218 1005 218" class="route" marker-end="url(#arrowCyan)"/>

  <!-- Sender -->
  <g transform="translate(111 219)">
    <circle r="34" fill="#0a1721" stroke="#00f3ff" stroke-opacity=".7" stroke-width="1.5"/>
    <circle r="25" fill="none" stroke="#00f3ff" stroke-opacity=".22"/>
    <path d="M-11-2h22v16h-22zM-7-2v-6a7 7 0 0 1 14 0v6" fill="none" stroke="#00f3ff" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="0" y="56" fill="#d6f9ff" class="tiny" text-anchor="middle" font-weight="700">SENDER</text>
    <text x="0" y="70" class="muted" font-size="8" text-anchor="middle">encrypts message</text>
  </g>

  <!-- First relay on the active route -->
  <g transform="translate(420 265)">
    <circle class="ring" r="23" fill="none" stroke="#00f3ff" stroke-opacity=".6"/>
    <circle r="18" fill="#091722" stroke="#00f3ff" stroke-opacity=".8" stroke-width="1.4"/>
    <circle r="5" fill="#00f3ff" filter="url(#glow)"/>
    <text x="0" y="43" fill="#b8f7ff" class="tiny" text-anchor="middle" font-weight="700">RELAY 01</text>
    <text x="0" y="57" class="muted" font-size="8" text-anchor="middle">forwards ciphertext</text>
  </g>

  <!-- Alternate relay -->
  <g transform="translate(420 149)">
    <circle r="18" fill="#0d1020" stroke="#b000ff" stroke-opacity=".72" stroke-width="1.3"/>
    <circle r="4.5" fill="#b000ff"/>
    <text x="0" y="-32" fill="#c9a5df" class="tiny" text-anchor="middle">ALTERNATE PEER</text>
  </g>

  <!-- Second relay / route junction -->
  <g transform="translate(710 218)">
    <circle class="ring delay" r="24" fill="none" stroke="#00f3ff" stroke-opacity=".55"/>
    <circle r="19" fill="#091722" stroke="#00f3ff" stroke-opacity=".8" stroke-width="1.4"/>
    <circle r="5" fill="#00f3ff" filter="url(#glow)"/>
    <text x="0" y="43" fill="#b8f7ff" class="tiny" text-anchor="middle" font-weight="700">RELAY 02</text>
    <text x="0" y="57" class="muted" font-size="8" text-anchor="middle">next-hop routing</text>
  </g>

  <!-- Recipient -->
  <g transform="translate(1050 219)">
    <circle r="34" fill="#0a1721" stroke="#b000ff" stroke-opacity=".82" stroke-width="1.5"/>
    <circle r="25" fill="none" stroke="#b000ff" stroke-opacity=".24"/>
    <path d="M-13-7h26v18h-26zM-13-5l13 9L13-5" fill="none" stroke="#d4a6ff" stroke-width="1.7" stroke-linejoin="round"/>
    <text x="0" y="56" fill="#e7d5ff" class="tiny" text-anchor="middle" font-weight="700">RECIPIENT</text>
    <text x="0" y="70" class="muted" font-size="8" text-anchor="middle">decrypts message</text>
  </g>

  <!-- Packet labels -->
  <g transform="translate(229 177)">
    <rect width="132" height="23" rx="3" fill="#07121b" stroke="#00f3ff" stroke-opacity=".35"/>
    <text x="66" y="15" fill="#9deff4" class="tiny" text-anchor="middle">SIGNED CIPHERTEXT</text>
  </g>
  <g transform="translate(791 251)">
    <rect width="144" height="23" rx="3" fill="#07121b" stroke="#b000ff" stroke-opacity=".34"/>
    <text x="72" y="15" fill="#d4b6eb" class="tiny" text-anchor="middle">TTL + HOP GUARDS</text>
  </g>

  <!-- Transport context -->
  <path d="M52 331H1148" stroke="#173346"/>
  <text x="55" y="360" fill="#7791a8" class="tiny">ANDROID LINKS</text>
  <g transform="translate(173 340)">
    <rect width="112" height="27" rx="3" fill="#08131d" stroke="#00f3ff" stroke-opacity=".34"/>
    <text x="56" y="18" fill="#b8f7ff" class="tiny" text-anchor="middle">WI-FI DIRECT</text>
  </g>
  <g transform="translate(297 340)">
    <rect width="65" height="27" rx="3" fill="#08131d" stroke="#00f3ff" stroke-opacity=".34"/>
    <text x="32.5" y="18" fill="#b8f7ff" class="tiny" text-anchor="middle">BLE</text>
  </g>
  <text x="733" y="360" fill="#7791a8" class="tiny">BROWSER DEMO</text>
  <g transform="translate(849 340)">
    <rect width="198" height="27" rx="3" fill="#08131d" stroke="#b000ff" stroke-opacity=".4"/>
    <text x="99" y="18" fill="#d7b4ef" class="tiny" text-anchor="middle">SIMULATED PEER SWARM</text>
  </g>
</svg>
